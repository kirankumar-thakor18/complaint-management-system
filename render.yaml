# Render Blueprint for Complaint Management System
# Backend serves the frontend too (see backend/app.js), so only one service is needed.
# Docs: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: complaint-management-system
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: NODE_VERSION
        value: "18.20.4"
      # Optional email (uncomment + fill to send real emails):
      # - key: APP_URL
      #   value: https://complaint-management-system.onrender.com
      # - key: SMTP_HOST
      #   value: smtp.gmail.com
      # - key: SMTP_PORT
      #   value: "587"
      # - key: SMTP_USER
      #   sync: false
      # - key: SMTP_PASS
      #   sync: false
