<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password | Complaint Management System</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="auth-container">
    <div class="auth-card">
      <h2>Reset Password</h2>
      <p class="auth-subtitle">Choose a new password for your account</p>

      <form id="resetForm" novalidate>
        <div class="form-group">
          <label for="newPassword">New Password</label>
          <input type="password" id="newPassword" name="newPassword" placeholder="At least 6 characters" required>
          <span class="error-msg" id="newPasswordError"></span>
        </div>
        <div class="form-group">
          <label for="confirmPassword">Confirm New Password</label>
          <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Re-enter password" required>
          <span class="error-msg" id="confirmError"></span>
        </div>
        <button type="submit" class="btn btn-primary btn-full">Reset Password</button>
      </form>

      <p class="auth-switch"><a href="login.html">Back to Login</a></p>
    </div>
  </div>

  <script src="js/toast.js"></script>
  <script src="js/reset-password.js"></script>
</body>
</html>
