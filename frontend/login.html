<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Complaint Management System</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div class="auth-container">
    <div class="auth-card">
      <div class="auth-tabs">
        <button type="button" class="auth-tab active" id="userTab">👤 User</button>
        <button type="button" class="auth-tab" id="adminTab">🛡️ Admin</button>
      </div>
      <h2 id="loginTitle">User Login</h2>
      <p class="auth-subtitle" id="loginSubtitle">Login to your account</p>

      <form id="loginForm" novalidate>
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" placeholder="you@example.com" required>
          <span class="error-msg" id="emailError"></span>
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" placeholder="••••••••" required>
          <span class="error-msg" id="passwordError"></span>
        </div>

        <p class="admin-hint" id="adminHint" style="display:none;">Admin demo: admin@college.edu / admin123</p>

        <button type="submit" class="btn btn-primary btn-full">Login</button>
      </form>

      <p class="auth-switch">Don't have an account? <a href="register.html">Register</a></p>
      <p class="auth-switch" style="margin-top:8px;"><a href="forgot-password.html">Forgot password?</a></p>
    </div>
  </div>

  <script src="js/toast.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
