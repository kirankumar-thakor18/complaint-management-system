<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register | Complaint Management System</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div class="auth-container">
    <div class="auth-card">
      <h2>Register</h2>
      <p class="auth-subtitle">Create a new account</p>

      <form id="registerForm" novalidate>
        <div class="form-group">
          <label for="name">Full Name</label>
          <input type="text" id="name" name="name" placeholder="Your Name" required>
          <span class="error-msg" id="nameError"></span>
        </div>

        <div class="form-group">
          <label for="regEmail">Email</label>
          <input type="email" id="regEmail" name="email" placeholder="you@example.com" required>
          <span class="error-msg" id="regEmailError"></span>
        </div>

        <div class="form-group">
          <label for="regPassword">Password</label>
          <input type="password" id="regPassword" name="password" placeholder="Min 6 characters" required>
          <span class="error-msg" id="regPasswordError"></span>
        </div>

        <div class="form-group">
          <label for="confirmPassword">Confirm Password</label>
          <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Re-enter password" required>
          <span class="error-msg" id="confirmPasswordError"></span>
        </div>

        <button type="submit" class="btn btn-primary btn-full">Register</button>
      </form>

      <p class="auth-switch">Already have an account? <a href="login.html">Login</a></p>
    </div>
  </div>

  <script src="js/toast.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
